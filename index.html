  {id:'u201',name:'شقة 201',beds:3,baths:3,status:'متاحة',clean:'clean',ownership:'rent',landlordRent:0,priceNight:0,priceMonth:0,priceYear:0,photos:U201_PHOTOS,desc:'صالة واسعة بأثاث مريح وشاشة وتكييف، ثلاث غرف نوم ببياضات نظيفة، مطبخ مجهز وطاولة طعام عائلية.',tags:['3 غرف','3 حمامات','صالة واسعة','مطبخ مجهز'],license:{platform:'Airbnb',owner:'قيد المراجعة',compound:'قيد المراجعة',hh:'قيد الإجراء',num:'',submitted:'',issued:'',expiry:'',docs:'غير متحقق',next:''}},

];}
const TEMPLATES=[
 {name:'رد أول على الاستفسار',text:'أهلاً بحضرتك 🌷\nشقتنا مفروشة بالكامل في المهندسين، ميدان لبنان.\nمتاحة من [تاريخ الدخول] إلى [تاريخ الخروج] بسعر [..] جنيه لليلة.\nتحب أبعتلك الصور والتفاصيل؟'},
 {name:'شروط الحجز والدفع',text:'للتأكيد نحتاج مقدم [..] جنيه، والباقي عند الاستلام.\nمطلوب صورة بطاقة أو جواز سفر لكل نزيل قبل الدخول.\nموعد الدخول من [..] والخروج [..].'},
 {name:'تأكيد الحجز وتعليمات الوصول',text:'تم تأكيد حجزك ✅\nالشقة: [اسم الشقة]\nالعنوان: [العنوان بالتفصيل]\nاللوكيشن: [رابط جوجل ماب]\nموعد الوصول: [..]\nهيستقبلك [..] عند العمارة.'},

 {name:'طلب تقييم بعد الخروج',text:'شكراً لإقامتك معنا يا [اسم النزيل] 🌷\nلو الإقامة عجبتك، رأيك في تقييم بسيط على [Airbnb / Booking] بيفرق معانا كتير.'},
 {name:'وصف إعلان (عربي)','text':'شقة مفروشة بالكامل في قلب المهندسين، بجوار ميدان لبنان 📍\n• [عدد الغرف] غرف و[عدد الحمامات] حمام\n• [المميزات الفعلية: واي فاي، تكييف، مطبخ مجهز]\n• مناسبة للعائلات\nللحجز والاستفسار: [رقم الواتساب]'},
 {name:'عرض للشركات (إيجار شهري)',text:'مرحباً [اسم الشخص]،\nعندنا شقق مفروشة بالكامل في المهندسين للإقامة الشهرية والسنوية للموظفين والزائرين، بعقد واضح وسعر ثابت.\nتحب أبعتلك التفاصيل والصور؟'}
];

let DB=null;
function load(){ try{const raw=localStorage.getItem(LS_KEY); if(raw){DB=JSON.parse(raw);} }catch(e){}
  if(!DB){DB={settings:defaultSettings(),apartments:defaultApartments(),bookings:[],expenses:[],tasks:[]};}
  // ترحيل الرمز القديم النصي إلى بصمة مشفرة (النسخ القديمة فقط)
  if(DB.settings && DB.settings.pin!==undefined){
    if(DB.settings.pin && !DB.settings.pinHash){DB.settings.pinSalt=newSalt();DB.settings.pinHash=pinHashOf(String(DB.settings.pin),DB.settings.pinSalt);}
    delete DB.settings.pin;
  }
  save(); }
function save(){ localStorage.setItem(LS_KEY,JSON.stringify(DB)); }

// رمز دخول المضيف: لا يوجد رمز افتراضي؛ يُنشئه المستخدم في أول دخول ويُحفظ كبصمة فقط
function newSalt(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function cyrb53(str,seed){seed=seed||0;let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(36)+(h1>>>0).toString(36);}
function pinHashOf(pin,salt){return cyrb53(salt+'|'+pin)+':'+cyrb53(pin+'|'+salt,7);}

// ============ أدوات ============
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);};
const nights=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
const fmt=n=>Number(n||0).toLocaleString('en-EG');
const monthStart=s=>s.slice(0,8)+'01';
const curMonth=()=>today().slice(0,7);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function uid(){return 'x'+Date.now().toString(36)+Math.floor(Math.random()*999);}
function aptName(id){const a=DB.apartments.find(a=>a.id===id);return a?a.name:'—';}
function activeBk(b){return b.status!=='ملغي';}
function overlap(a,inD,outD,ignoreId){return DB.bookings.some(b=>activeBk(b)&&b.apt===a&&b.id!==ignoreId&&b.in<outD&&inD<b.out);}

// ============ واجهة الضيوف ============
function guestView(){
  const s=DB.settings;
  const apts=DB.apartments.map(a=>{
    const ph=a.photos&&a.photos.length?`<img src="${esc(a.photos[0].src)}" alt="${esc(a.photos[0].alt||a.name)}" style="width:100%;height:190px;object-fit:cover;border-radius:14px">`:`<div style="width:100%;height:190px;border-radius:14px;background:#e7efec;display:flex;align-items:center;justify-content:center;font-size:34px">🏨</div>`;
    const price=a.priceNight?`<div style="font-weight:800;color:#0f766e;font-size:18px">${fmt(a.priceNight)} ج.م <span style="font-size:12px;color:#8a8486">/ ليلة</span></div>`:'<div style="font-size:13px;color:#8a8486">السعر عند الاستفسار</div>';
    return `<div class="card" style="padding:14px;margin-bottom:14px">${ph}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <div><div style="font-weight:800;font-size:17px">${esc(a.name)}</div>
        <div style="font-size:13px;color:#585254">${esc((a.tags||[]).join(' · '))}</div></div>${price}</div>
      <div style="font-size:14px;color:#585254;margin-top:6px">${esc(a.desc||'')}</div>
      <a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:10px" target="_blank" href="https://api.whatsapp.com/send?phone=${encodeURIComponent(s.wa)}&text=${encodeURIComponent('أهلاً، حابب أستفسر عن '+a.name+' في ميدان لبنان')}">استفسر على واتساب</a>
    </div>`;}).join('');
  return `
  <div style="max-width:520px;margin:0 auto;padding:16px 14px 110px">
    <div style="text-align:center;padding:26px 0 8px">
      <div style="font-size:26px;font-weight:800">لبنان استور</div>
      <div style="color:#585254;font-size:14px">شقق مفروشة بالكامل · ميدان لبنان، المهندسين</div>
    </div>
    <div class="card" style="padding:12px 14px;margin:10px 0 16px;font-size:13px;color:#585254">
      📍 ${esc(s.address)} · أقل حجز ${s.minNights} ليالٍ · دخول ${esc(s.checkIn)}
    </div>
    ${apts}
    <div class="card" style="padding:14px;margin-top:8px">
      <div style="font-weight:800;margin-bottom:6px">الضمانات</div>
      <div style="font-size:14px;color:#585254;line-height:1.9">✨ نظافة وتعقيم قبل كل حجز<br>🛏️ بياضات نظيفة ومطبخ مرتب<br>📶 واي فاي منزلي سريع<br>❄️ تكييف في الصالة والغرف</div>
      <div style="font-size:13px;color:#8a8486;margin-top:10px">${esc(s.policyNote)}</div>
      <div style="font-size:13px;color:#8a8486;margin-top:6px">${esc(s.payNote)}</div>
      <div style="font-size:13px;color:#8a8486;margin-top:6px">${esc(s.priceNote)}</div>
    </div>
    <div style="text-align:center;margin-top:14px">
      <button class="btn3" onclick="askPin()">دخول المضيف</button>
    </div>
  </div>`;
}
function askPin(){
  if(!DB.settings.pinHash){
    showModal(`<div style="font-weight:800;font-size:17px;margin-bottom:8px">إنشاء رمز دخول</div>
      <div style="font-size:13px;color:#666;margin-bottom:10px">هذا أول دخول للوحة المضيف من هذا الجهاز. أنشئ رمزاً من 4 إلى 8 أرقام واحفظه جيداً — لا يوجد رمز افتراضي.</div>
      <label>رمز الدخول الجديد</label>
      <input id="pinNew" class="inp" type="password" inputmode="numeric" maxlength="8" dir="ltr">
      <label>تأكيد الرمز الجديد</label>
      <input id="pinNew2" class="inp" type="password" inputmode="numeric" maxlength="8" dir="ltr">
      <button class="btn" style="width:100%;margin-top:14px" onclick="createPin()">حفظ الرمز ودخول</button>`);
    setTimeout(()=>{const i=$('#pinNew');if(i)i.focus();},100);
    return;
  }
  showModal(`<div style="font-weight:800;font-size:17px;margin-bottom:8px">دخول المضيف</div>
    <label>رمز الدخول</label>
    <input id="pinIn" class="inp" type="password" inputmode="numeric" maxlength="8" dir="ltr">
    <button class="btn" style="width:100%;margin-top:14px" onclick="tryPin()">دخول</button>`);
  setTimeout(()=>{const i=$('#pinIn');if(i)i.focus();},100);
}
function enterHost(){closeModal();state.view='host';state.tab='dash';render();}
function createPin(){
  const a=$('#pinNew').value.trim(),b=$('#pinNew2').value.trim();
  if(!/^\d{4,8}$/.test(a))return toast('الرمز لازم يكون من 4 إلى 8 أرقام');
  if(a!==b)return toast('الرمزان غير متطابقين');
  DB.settings.pinSalt=newSalt();DB.settings.pinHash=pinHashOf(a,DB.settings.pinSalt);save();
  enterHost();toast('تم إنشاء رمز الدخول ✅');
}
function tryPin(){ const s=DB.settings; if(s.pinHash && pinHashOf($('#pinIn').value,s.pinSalt)===s.pinHash){enterHost();} else toast('الرمز غير صحيح'); }
function askChangePin(){
  showModal(`<div style="font-weight:800;font-size:17px;margin-bottom:8px">تغيير رمز الدخول</div>
    <label>الرمز الحالي</label>
    <input id="pinCur" class="inp" type="password" inputmode="numeric" maxlength="8" dir="ltr">
    <label>الرمز الجديد (4 إلى 8 أرقام)</label>
    <input id="pinNew" class="inp" type="password" inputmode="numeric" maxlength="8" dir="ltr">
    <label>تأكيد الرمز الجديد</label>
    <input id="pinNew2" class="inp" type="password" inputmode="numeric" maxlength="8" dir="ltr">
    <button class="btn" style="width:100%;margin-top:14px" onclick="changePin()">تغيير الرمز</button>`);
  setTimeout(()=>{const i=$('#pinCur');if(i)i.focus();},100);
}
function changePin(){
  const s=DB.settings,cur=$('#pinCur').value,a=$('#pinNew').value.trim(),b=$('#pinNew2').value.trim();
  if(s.pinHash && pinHashOf(cur,s.pinSalt)!==s.pinHash)return toast('الرمز الحالي غير صحيح');
  if(!/^\d{4,8}$/.test(a))return toast('الرمز الجديد لازم يكون من 4 إلى 8 أرقام');
  if(a!==b)return toast('الرمزان غير متطابقين');
  s.pinSalt=newSalt();s.pinHash=pinHashOf(a,s.pinSalt);save();closeModal();toast('تم تغيير رمز الدخول ✅');
}

// ============ واجهة المضيف ============
const TABS=[['dash','الرئيسية'],['bookings','الحجوزات'],['cal','التقويم'],['money','الماليات'],['lic','التراخيص'],['tools','أدوات']];
function hostView(){
  const tabs=TABS.map(t=>`<div class="tabbtn ${state.tab===t[0]?'on':''}" onclick="state.tab='${t[0]}';render()">${t[1]}</div>`).join('');
  let body='';
  if(state.tab==='dash')body=dashView();
  else if(state.tab==='bookings')body=bookingsView();
  else if(state.tab==='cal')body=calView();
  else if(state.tab==='money')body=moneyView();
  else if(state.tab==='lic')body=licView();
  else body=toolsView();
  return `<div style="max-width:640px;margin:0 auto;padding:12px 12px 110px">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 2px 12px">
      <div style="font-weight:800;font-size:18px">🏨 إدارة الشقق</div>

function smartAlerts(){
  const al=[];const t=today();
  DB.apartments.forEach(a=>{
    const busy=DB.bookings.some(b=>activeBk(b)&&b.apt===a.id&&b.in<=addDays(t,7)&&b.out>t);
    if(!busy)al.push({txt:`${a.name} فاضية الأسبوع الجاي كله. ممكن تعمل عرض أو تنشر لينك الضيوف.`});
    if(a.clean==='dirty')al.push({txt:`${a.name} محتاجة تنضيف.`});
    const ex=a.license&&a.license.expiry;
    if(ex&&ex>=t&&ex<=addDays(t,60))al.push({txt:`ترخيص ${a.name} بينتهي في ${ex}. راجع ورقة التراخيص.`});
    if(a.license&&(a.license.hh==='غير مرخص'))al.push({txt:`${a.name} غير مرخصة كـ Holiday Home.`});
  });
  DB.bookings.filter(b=>activeBk(b)&&b.status!=='انتهى'&&(Number(b.total||0)-Number(b.paid||0))>0&&b.in<=t)
    .forEach(b=>al.push({txt:`متبقي ${fmt(Number(b.total||0)-Number(b.paid||0))} ج.م على حجز ${b.name} (${aptName(b.apt)}).`}));
  return al;
}

function saveBooking(id,isEdit){
  const b={id,apt:$('#bkApt').value,name:$('#bkName').value.trim(),phone:$('#bkPhone').value.trim(),type:$('#bkType').value,in:$('#bkIn').value,out:$('#bkOut').value,total:Number($('#bkTotal').value||0),paid:Number($('#bkPaid').value||0),channel:$('#bkCh').value,commission:Number($('#bkCom').value||0),status:$('#bkStatus').value,note:$('#bkNote').value.trim(),createdAt:Date.now()};
  if(!b.name||!b.in||!b.out||b.out<=b.in){toast('راجع الاسم والتواريخ');return;}
  if(b.status!=='ملغي'&&overlap(b.apt,b.in,b.out,isEdit?id:null)){toast('في حجز متعارض على نفس الشقة في التواريخ دي');return;}
  if(isEdit){const i=DB.bookings.findIndex(x=>x.id===id);DB.bookings[i]=Object.assign(DB.bookings[i],b);}else DB.bookings.push(b);
  save();closeModal();render();toast('اتحفظ الحجز ✅');
}
function delBooking(id){const b=DB.bookings.find(b=>b.id===id);if(!b)return;b.status='ملغي';save();closeModal();render();toast('اتلغى الحجز');}
function exportBookingsCSV(){
  const head='الشقة,اسم النزيل,الموبايل,النوع,الدخول,الخروج,الليالي,الإجمالي,المدفوع,المتبقي,القناة,عمولة الوسيط,الحالة,ملاحظات';
  const rows=DB.bookings.map(b=>[aptName(b.apt),b.name,b.phone,b.type,b.in,b.out,nights(b.in,b.out),b.total,b.paid,Number(b.total||0)-Number(b.paid||0),b.channel,b.commission||0,b.status,(b.note||'').replace(/,/g,'،')].join(','));
  download('حجوزات-لبنان-استور.csv','\ufeff'+head+'\n'+rows.join('\n'),'text/csv');
}
function importICS(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.ics';
  inp.onchange=()=>{const f=inp.files[0];if(f)handleICSFile(f);};
  inp.click();
}
function handleICSFile(f){
  const r=new FileReader();
    r.onload=()=>{const txt=r.result;let added=0;
      const evs=txt.split('BEGIN:VEVENT').slice(1);
      const apt=DB.apartments[0];
      evs.forEach(ev=>{
        const ds=(ev.match(/DTSTART[^:]*:(\d{8})/)||[])[1], de=(ev.match(/DTEND[^:]*:(\d{8})/)||[])[1];
        if(!ds||!de)return;
        const din=ds.slice(0,4)+'-'+ds.slice(4,6)+'-'+ds.slice(6,8), dout=de.slice(0,4)+'-'+de.slice(4,6)+'-'+de.slice(6,8);
        if(DB.bookings.some(b=>b.apt===apt.id&&b.in===din&&b.out===dout))return;
        if(overlap(apt.id,din,dout,null))return;
        DB.bookings.push({id:uid(),apt:apt.id,name:'حجز Airbnb',phone:'',type:'يومي',in:din,out:dout,total:0,paid:0,channel:'Airbnb',commission:0,status:'مؤكد',note:'مستورد من تقويم Airbnb، راجع التفاصيل على لوحة المضيف',createdAt:Date.now()});added++;
      });
      save();render();toast(added?`اتضاف ${added} حجز من Airbnb`:'مفيش حجوزات جديدة في الملف');};
    r.readAsText(f);
}

let calMonth=curMonth();
function calView(){
  const y=Number(calMonth.slice(0,4)),mo=Number(calMonth.slice(5,7));

  }

    <div style="display:flex;gap:8px">
      <div style="flex:1"><label>الملكية</label><select class="inp" id="apOwn${i}"><option value="own" ${a.ownership==='own'?'selected':''}>ملك</option><option value="rent" ${a.ownership==='rent'?'selected':''}>إيجار</option></select></div>
      <div style="flex:1"><label>إيجار المالك الشهري</label><input id="apRent${i}" type="number" class="inp" value="${a.landlordRent||0}"></div></div>
    <div style="display:flex;gap:8px">
      <div style="flex:1"><label>سعر الليلة</label><input id="apN${i}" type="number" class="inp" value="${a.priceNight||0}"></div>
      <div style="flex:1"><label>الشهري</label><input id="apM${i}" type="number" class="inp" value="${a.priceMonth||0}"></div>
      <div style="flex:1"><label>السنوي</label><input id="apY${i}" type="number" class="inp" value="${a.priceYear||0}"></div></div>
  </div>`).join('');
  showModal(`<div style="font-weight:800;font-size:17px;margin-bottom:6px">الشقق والأسعار</div>${rows}
    <button class="btn" style="width:100%;margin-top:8px" onclick="saveApartments(${DB.apartments.length})">حفظ</button>`);
}
function saveApartments(n){
  for(let i=0;i<n;i++){const a=DB.apartments[i];
    a.ownership=$('#apOwn'+i).value;a.landlordRent=Number($('#apRent'+i).value||0);
    a.priceNight=Number($('#apN'+i).value||0);a.priceMonth=Number($('#apM'+i).value||0);a.priceYear=Number($('#apY'+i).value||0);}
  save();closeModal();render();toast('اتحفظ ✅');
}

// ============ التراخيص ============
function licView(){
  const cards=DB.apartments.map(a=>{
    const L=a.license||{};
    const chip=L.hh==='مرخص'?'chip':(L.hh==='قيد الإجراء'?'chip warn':'chip bad');
    return `<div class="card" style="padding:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:800">${esc(a.name)}</div><span class="${chip}">${esc(L.hh||'غير متحقق')}</span></div>
      <div style="font-size:13px;color:#585254;margin-top:4px">المنصة: ${esc(L.platform||'—')} · موافقة المالك: ${esc(L.owner||'—')} · الكمبوند: ${esc(L.compound||'—')}</div>
      <div style="font-size:13px;color:#585254">رقم الترخيص: ${esc(L.num||'—')} · الانتهاء/المراجعة: ${esc(L.expiry||'—')} · المستندات: ${esc(L.docs||'—')}</div>
      ${L.next?`<div style="font-size:13px;color:#b45309;margin-top:4px">الخطوة التالية: ${esc(L.next)}</div>`:''}
      <button class="btn3" style="margin-top:8px;font-size:13px" onclick="editLic('${a.id}')">تحديث الترخيص</button>
    </div>`;}).join('');
  return `<div class="card" style="padding:12px;margin-bottom:12px;font-size:14px;color:#585254">متابعة تراخيص Holiday Home وموافقات الملاك وإدارة الكمبوند لكل شقة. التنبيهات بتظهر في الصفحة الرئيسية قبل الانتهاء بـ 60 يوم.</div>${cards}`;
}
function editLic(id){
  const a=DB.apartments.find(a=>a.id===id);const L=a.license=a.license||{};
  const opts=(arr,v)=>arr.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('');
  showModal(`<div style="font-weight:800;font-size:17px;margin-bottom:6px">ترخيص ${esc(a.name)}</div>
    <label>المنصة/القنوات</label><select id="lcPlat" class="inp">${opts(['Airbnb','Booking.com','المنصتان','حجز مباشر','أخرى'],L.platform)}</select>
    <div style="display:flex;gap:8px">
      <div style="flex:1"><label>موافقة المالك</label><select id="lcOwner" class="inp">${opts(YESNO,L.owner)}</select></div>
      <div style="flex:1"><label>موافقة الكمبوند</label><select id="lcComp" class="inp">${opts(YESNO,L.compound)}</select></div></div>
    <div style="display:flex;gap:8px">
      <div style="flex:1"><label>حالة Holiday Home</label><select id="lcHH" class="inp">${opts(LIC_STATUS,L.hh)}</select></div>
      <div style="flex:1"><label>المستندات</label><select id="lcDocs" class="inp">${opts(DOC_STATUS,L.docs)}</select></div></div>
    <label>رقم الترخيص/الطلب</label><input id="lcNum" class="inp" value="${esc(L.num||'')}">
    <div style="display:flex;gap:8px">
      <div style="flex:1"><label>تاريخ التقديم</label><input id="lcSub" type="date" class="inp" value="${L.submitted||''}"></div>
      <div style="flex:1"><label>تاريخ الانتهاء/المراجعة</label><input id="lcExp" type="date" class="inp" value="${L.expiry||''}"></div></div>
    <label>الخطوة التالية/ملاحظات</label><input id="lcNext" class="inp" value="${esc(L.next||'')}">
    <button class="btn" style="width:100%;margin-top:14px" onclick="saveLic('${id}')">حفظ</button>`);
}
function saveLic(id){
  const a=DB.apartments.find(a=>a.id===id);
  a.license={platform:$('#lcPlat').value,owner:$('#lcOwner').value,compound:$('#lcComp').value,hh:$('#lcHH').value,docs:$('#lcDocs').value,num:$('#lcNum').value.trim(),submitted:$('#lcSub').value,expiry:$('#lcExp').value,next:$('#lcNext').value.trim()};
  save();closeModal();render();toast('اتحفظ الترخيص ✅');
}

// ============ أدوات ============
function toolsView(){
  const tmpls=TEMPLATES.map((t,i)=>`<div class="card" style="padding:12px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-weight:800;font-size:14px">${esc(t.name)}</div>
      <button class="btn2" style="padding:4px 12px;font-size:12px" onclick="copyTemplate(${i})">نسخ</button></div>
    <div style="font-size:13px;color:#585254;white-space:pre-wrap;margin-top:6px">${esc(t.text)}</div></div>`).join('');
  return `
  <div style="font-weight:800;margin-bottom:8px">نصوص واتساب وإعلانات جاهزة</div>
  ${tmpls}
  <div style="font-weight:800;margin:16px 0 8px">كروت QR للشقق</div>
  <button class="btn2" style="width:100%" onclick="qrCards()">عرض كروت الطباعة</button>
  <div style="font-weight:800;margin:16px 0 8px">النسخ الاحتياطي والبيانات</div>
  <div style="display:flex;gap:8px">
    <button class="btn3" style="flex:1" onclick="exportJSON()">تصدير نسخة JSON</button>
    <button class="btn3" style="flex:1" onclick="importJSON()">استيراد نسخة JSON</button>
  </div>
  <button class="btn3" style="width:100%;margin-top:8px" onclick="editSettings()">إعدادات عامة (واتساب، واي فاي)</button>
  <div style="font-size:12px;color:#8a8486;margin-top:14px">البيانات محفوظة على هذا الجهاز وبتتزامن بالنسخ الاحتياطي JSON. خطوة جاية مقترحة: ربط قاعدة بيانات Supabase للمزامنة التلقائية بين الأجهزة.</div>`;
}
function copyTemplate(i){copyText(TEMPLATES[i].text);toast('اتنسخ النص ✅');}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));}
  else fallbackCopy(t);
}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}
function qrCards(){
  const s=DB.settings;
  showModal(`<div style="font-weight:800;font-size:17px;margin-bottom:6px">كروت QR للشقق</div>
    <div style="font-size:13px;color:#8a8486;margin-bottom:10px">كل كارت بيتطبع في صفحة لوحده. املأ اسم الواي فاي والباسورد من الإعدادات الأول.</div>
    <div id="printArea">${DB.apartments.map((a,i)=>`
      <div class="qrCard">
        <div style="text-align:center;font-weight:800;font-size:18px">🏨 ${esc(a.name)} · لبنان استور</div>
        <div style="display:flex;gap:14px;margin-top:14px;justify-content:center">
          <div style="text-align:center"><div class="qrbox" id="qrw${i}"></div><div style="font-size:11px;margin-top:4px">📶 الواي فاي</div></div>
          <div style="text-align:center"><div class="qrbox" id="qrc${i}"></div><div style="font-size:11px;margin-top:4px">💬 تواصل معنا</div></div>
        </div>
        <div style="font-size:13px;margin-top:12px">الشبكة: <b>${esc(s.wifiSsid||'—')}</b><br>الباسورد: <b dir="ltr">${esc(s.wifiPass||'—')}</b></div>
        ${s.applianceNote?`<div style="font-size:12px;color:#585254;margin-top:8px">${esc(s.applianceNote)}</div>`:''}
      </div>`).join('')}</div>
    <button class="btn" style="width:100%;margin-top:10px" onclick="window.print()">طباعة (أو حفظ PDF)</button>`);
  DB.apartments.forEach((a,i)=>{
    try{
      new QRCode($('#qrw'+i),{text:'WIFI:T:WPA;S:'+(s.wifiSsid||'')+';P:'+(s.wifiPass||'')+';;',width:96,height:96});
      new QRCode($('#qrc'+i),{text:'https://wa.me/'+s.wa,width:96,height:96});
    }catch(e){}
  });
}
function exportJSON(){download('نسخة-احتياطية-لبنان-استور.json',JSON.stringify(DB,null,1),'application/json');}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=()=>{const f=inp.files[0];if(f)handleJSONFile(f);};
  inp.click();
}
function handleJSONFile(f){
  const r=new FileReader();
    r.onload=()=>{try{
      const d=JSON.parse(r.result);
      if(d.settings)DB.settings=Object.assign(defaultSettings(),d.settings);
      if(Array.isArray(d.apartments))DB.apartments=d.apartments.map(a=>Object.assign({photos:[],clean:'clean',ownership:'rent',landlordRent:0,priceNight:0,priceMonth:0,priceYear:0,license:{}},a));
      if(Array.isArray(d.bookings))DB.bookings=d.bookings.map(b=>Object.assign({commission:0,channel:'مباشر',type:'يومي',paid:0,total:0},b));
      if(Array.isArray(d.expenses))DB.expenses=d.expenses;
      save();render();toast('اتحملت النسخة ✅');
    }catch(e){toast('الملف مش صالح');}};
    r.readAsText(f);
}
function editSettings(){
  const s=DB.settings;
  showModal(`<div style="font-weight:800;font-size:17px;margin-bottom:6px">إعدادات عامة</div>
    <label>رقم واتساب (بالكود الدولي)</label><input id="stWa" class="inp" dir="ltr" value="${esc(s.wa)}">
    <label>العنوان</label><input id="stAddr" class="inp" value="${esc(s.address)}">
    <label>اسم شبكة الواي فاي</label><input id="stSsid" class="inp" dir="ltr" value="${esc(s.wifiSsid)}">
    <label>باسورد الواي فاي</label><input id="stPass" class="inp" dir="ltr" value="${esc(s.wifiPass)}">
    <label>تعليمات تشغيل الأجهزة</label><input id="stApp" class="inp" value="${esc(s.applianceNote)}">
    <button class="btn3" style="width:100%;margin-top:10px" onclick="askChangePin()">تغيير رمز دخول المضيف</button>
    <button class="btn" style="width:100%;margin-top:14px" onclick="saveSettings()">حفظ الإعدادات</button>`);
}
function saveSettings(){
  const s=DB.settings;
  s.wa=$('#stWa').value.trim();s.address=$('#stAddr').value.trim();s.wifiSsid=$('#stSsid').value.trim();s.wifiPass=$('#stPass').value.trim();s.applianceNote=$('#stApp').value.trim();
  save();closeModal();render();toast('اتحفظت الإعدادات ✅');
}

// ============ أساسيات ============
function download(name,content,mime){
  const b=new Blob([content],{type:mime+';charset=utf-8'});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);
}
function showModal(html){$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div>${html}</div></div>`;}
function closeModal(){$('#modalRoot').innerHTML='';}
let state={view:'guest',tab:'dash'};
function render(){$('#app').innerHTML=state.view==='guest'?guestView():hostView();}
load();
render();
</script>
</body>
</html>
